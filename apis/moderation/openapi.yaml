openapi: 3.0.3
info:
  title: NeoMarket Moderation
  version: "1.0"
  description: |
    Модуль модерации товаров.

    Логика работы:
    1. Moderation узнаёт что товар создан или изменён (формат события — ???)
    2. Запрашивает данные товара из B2B (GET /api/v1/products/{id})
    3. Сохраняет снимок товара. Если товар изменён — два снимка: "до" и "после"
    4. Модератор берёт карточку из очереди и проверяет
    5. Одобряет или блокирует — и сообщает B2B (формат события — ???)

paths:
  /api/v1/events/product:
    post:
      summary: Receive a product lifecycle event from B2B
      tags: [Events]
      security:
        - serviceKey: []
      parameters:
        - name: X-Service-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductEventRequest'
      responses:
        '200':
          description: Event accepted or ignored idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEventResponse'
        '400':
          description: Invalid product event.
        '401':
          description: Invalid service key.

  /api/v1/product-moderation/get-next:
    post:
      summary: Следующая карточка из очереди
      tags: [Queue]
      responses:
        "200":
          description: Карточка для проверки
          content:
            application/json:
              schema:
                type: object
                # Формат ответа — проектируется
        "204":
          description: Очередь пуста

  /api/v1/tickets/{ticket_id}/approve:
    post:
      summary: Approve a moderation ticket
      tags: [Decisions]
      security:
        - bearerHttpAuthentication: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationActionRequest'
      responses:
        '200':
          description: Ticket approved and PRODUCT_MODERATED event delivered to B2B.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          description: Authentication required.
        '404':
          description: Ticket not found.
        '409':
          description: Ticket is assigned to another moderator or cannot be approved.
        '503':
          description: B2B event destination unavailable; ticket remains IN_REVIEW.

  /api/v1/products/{id}/approve:
    post:
      summary: Одобрить товар
      tags: [Decisions]
      security:
        - bearerHttpAuthentication: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationActionRequest'
      responses:
        '200':
          description: Product approved and MODERATED event emitted to B2B.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationActionResponse'
        '401':
          description: Authentication required.
        '403':
          description: Card is assigned to another moderator.
        '404':
          description: Product not found in moderation queue.
        '409':
          description: Product is not in review or has no SKUs.
        '503':
          description: B2B event destination unavailable; card remains IN_REVIEW.

  /api/v1/products/{id}/decline:
    post:
      summary: Заблокировать товар (с причиной)
      tags: [Decisions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # Что нужно, чтобы продавец понял что исправить?
              # Достаточно общей причины — или надо указать конкретные поля?
      responses:
        "200":
          description: Товар заблокирован, статус → BLOCKED
        "404":
          description: Товар не найден в очереди

  /api/v1/product-blocking-reasons:
    get:
      summary: Список причин блокировки
      tags: [Reference]
      responses:
        "200":
          description: Список причин
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  # Формат — проектируется

components:
  securitySchemes:
    bearerHttpAuthentication:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
  schemas:
    ModerationActionRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 2000
        moderator_comment:
          type: string
          maxLength: 1000
          deprecated: true
    ModerationActionResponse:
      type: object
      required: [product_id, status]
      properties:
        product_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [MODERATED]
    TicketResponse:
      type: object
      required: [id, product_id, seller_id, kind, status, queue_priority, created_at]
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        seller_id: {type: string, format: uuid}
        kind: {type: string}
        status: {type: string}
        queue_priority: {type: integer}
        created_at: {type: string, format: date-time}
    ModerationDecisionEvent:
      type: object
      required: [idempotency_key, event_type, occurred_at, payload]
      properties:
        idempotency_key: {type: string, format: uuid}
        event_type: {type: string, enum: [PRODUCT_MODERATED, PRODUCT_BLOCKED]}
        occurred_at: {type: string, format: date-time}
        payload:
          type: object
          required: [product_id, status]
          properties:
            product_id: {type: string, format: uuid}
            status: {type: string, enum: [MODERATED, BLOCKED]}
            hard_block: {type: boolean}
    ProductEventRequest:
      type: object
      required: [product_id, seller_id, event, date]
      properties:
        product_id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        event:
          type: string
          enum: [CREATED, EDITED, DELETED]
        date:
          type: string
          format: date-time
    ProductEventResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        ignored:
          type: boolean
          default: false
