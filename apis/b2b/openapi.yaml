openapi: 3.0.3
info:
  title: NeoMarket B2B (Seller Cabinet)
  version: "1.0"
  description: |
    Кабинет продавца. Создание товаров, SKU, управление ценами, накладные.
    Связи с Moderation и B2C — частично восстановлены, детали проектируются.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: At least one image is required
    CreateProductRequest:
      type: object
      required: [title, description, category_id]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 5000
        category_id:
          type: string
          format: uuid
        images:
          type: array
          default: []
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/Image"
        characteristics:
          type: array
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/CharacteristicValue"

    SKUCreate:
      type: object
      required: [product_id, name, price]
      additionalProperties: false
      properties:
        product_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 255}
        price: {type: integer, minimum: 1, description: Price in kopecks}
        cost_price: {type: integer, minimum: 0}
        discount: {type: integer, minimum: 0}
        article: {type: string, nullable: true, maxLength: 100}
        images:
          type: array
          default: []
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/Image"
        characteristics:
          type: array
          default: []
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/CharacteristicValue"
    SKUResponse:
      type: object
      required: [id, product_id, name, price, discount, cost_price, active_quantity, reserved_quantity, article, images, characteristics, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        name: {type: string}
        price: {type: integer}
        discount: {type: integer}
        cost_price: {type: integer}
        active_quantity: {type: integer, minimum: 0}
        reserved_quantity: {type: integer, minimum: 0}
        article: {type: string}
        images:
          type: array
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/Image"
        characteristics:
          type: array
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/CharacteristicValue"
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ProductResponse:
      type: object
      required: [id, seller_id, title, description, status, deleted, blocked, category_id, category, slug, images, characteristics, skus, blocking_reason_id, moderator_comment, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        seller_id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        status: {type: string, enum: [CREATED, ON_MODERATION, MODERATED, BLOCKED, HARD_BLOCKED, DELETED]}
        deleted: {type: boolean}
        blocked: {type: boolean}
        category_id: {type: string, format: uuid}
        category:
          type: object
          required: [id, name]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        slug: {type: string}
        images:
          type: array
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/Image"
        characteristics:
          type: array
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/CharacteristicValue"
        skus:
          type: array
          items:
            $ref: "#/components/schemas/SKUResponse"
        blocking_reason_id: {type: string, format: uuid, nullable: true}
        moderator_comment: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

paths:
  /api/v1/skus:
    post:
      summary: Create a product SKU
      tags: [SKU]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SKUCreate"
      responses:
        "201":
          description: SKU created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SKUResponse"
        "400": {description: Invalid SKU request}
        "401": {description: Missing or invalid JWT}
        "403": {description: Seller does not own the product or product is hard-blocked}
        "404": {description: Product not found}

  /api/v1/products:
    post:
      summary: Создать товар
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Товар создан со статусом CREATED и пустым списком SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Некорректные данные товара или неизвестная категория
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Отсутствует или некорректен JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/products/{id}:
    get:
      summary: Получить товар со всеми SKU
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Товар с SKU, характеристиками и фото
          content:
            application/json:
              schema:
                $ref: "../shared/schemas.yaml#/components/schemas/Product"
              example:
                id: 42
                title: "iPhone 15 Pro Max"
                description: "Флагман Apple..."
                status: "MODERATED"
                category:
                  id: 3
                  name: "Смартфоны"
                images:
                  - url: "/s3/iphone15-1.jpg"
                    ordering: 0
                characteristics:
                  - name: "Бренд"
                    value: "Apple"
                skus:
                  - id: 101
                    name: "256GB Black"
                    price: 12999000
                    activeQuantity: 5
                    characteristics:
                      - name: "Цвет"
                        value: "Чёрный"
                      - name: "Объём памяти"
                        value: "256 ГБ"
                  - id: 102
                    name: "256GB White"
                    price: 12999000
                    activeQuantity: 0
        "404":
          description: Товар не найден

    put:
      summary: Изменить товар
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Товар обновлён

  /api/v1/skus:
    post:
      summary: Создать SKU
      tags: [SKU]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: SKU создан

    put:
      summary: Изменить SKU
      tags: [SKU]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: SKU обновлён

  /api/v1/invoices:
    post:
      summary: Создать накладную
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Накладная создана

  /api/v1/invoices/accept:
    post:
      summary: Принять накладную (склад)
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Накладная принята, остатки обновлены

  # ??? — Эндпоинты для B2C (каталог, резервирование) — проектируются
