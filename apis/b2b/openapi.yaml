openapi: 3.0.3
info:
  title: NeoMarket B2B (Seller Cabinet)
  version: "1.0"
  description: |
    Кабинет продавца. Создание товаров, SKU, управление ценами, накладные.
    Связи с Moderation и B2C — частично восстановлены, детали проектируются.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: At least one image is required
    CreateProductRequest:
      type: object
      required: [title, description, category_id, images]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 5000
        category_id:
          type: string
          format: uuid
        images:
          type: array
          minItems: 1
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/Image"
        characteristics:
          type: array
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/CharacteristicValue"
    CreateSkuRequest:
      type: object
      required: [product_id, name, price, cost_price, image]
      properties:
        product_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        price:
          type: integer
          minimum: 1
          description: Цена продажи в копейках
        cost_price:
          type: integer
          minimum: 1
          description: Себестоимость в копейках
        discount:
          type: integer
          minimum: 0
          default: 0
          description: Абсолютная скидка в копейках
        image:
          type: string
          minLength: 1
          format: uri-reference
        characteristics:
          type: array
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/CharacteristicValue"
    SkuResponse:
      type: object
      required: [id, product_id, name, price, cost_price, discount, image, active_quantity, reserved_quantity, characteristics]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: integer
        cost_price:
          type: integer
        discount:
          type: integer
        image:
          type: string
        active_quantity:
          type: integer
          default: 0
        reserved_quantity:
          type: integer
          default: 0
        characteristics:
          type: array
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/CharacteristicValue"

paths:
  /api/v1/products:
    post:
      summary: Создать товар
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Товар создан со статусом CREATED и пустым списком SKU
          content:
            application/json:
              schema:
                $ref: "../shared/schemas.yaml#/components/schemas/Product"
        "400":
          description: Некорректные данные товара или неизвестная категория
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Отсутствует или некорректен JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/products/{id}:
    get:
      summary: Получить товар со всеми SKU
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Товар с SKU, характеристиками и фото
          content:
            application/json:
              schema:
                $ref: "../shared/schemas.yaml#/components/schemas/Product"
              example:
                id: 42
                title: "iPhone 15 Pro Max"
                description: "Флагман Apple..."
                status: "MODERATED"
                category:
                  id: 3
                  name: "Смартфоны"
                images:
                  - url: "/s3/iphone15-1.jpg"
                    ordering: 0
                characteristics:
                  - name: "Бренд"
                    value: "Apple"
                skus:
                  - id: 101
                    name: "256GB Black"
                    price: 12999000
                    activeQuantity: 5
                    characteristics:
                      - name: "Цвет"
                        value: "Чёрный"
                      - name: "Объём памяти"
                        value: "256 ГБ"
                  - id: 102
                    name: "256GB White"
                    price: 12999000
                    activeQuantity: 0
        "404":
          description: Товар не найден

    put:
      summary: Изменить товар
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Товар обновлён

  /api/v1/skus:
    post:
      summary: Создать SKU
      tags: [SKU]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkuRequest"
      responses:
        "201":
          description: SKU создан; первый SKU переводит товар CREATED в ON_MODERATION и публикует событие CREATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkuResponse"
        "400":
          description: Некорректные данные SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Товар заблокирован или не принадлежит продавцу
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    put:
      summary: Изменить SKU
      tags: [SKU]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: SKU обновлён

  /api/v1/invoices:
    post:
      summary: Создать накладную
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Накладная создана

  /api/v1/invoices/accept:
    post:
      summary: Принять накладную (склад)
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Накладная принята, остатки обновлены

  # ??? — Эндпоинты для B2C (каталог, резервирование) — проектируются
