openapi: 3.0.3
info:
  title: NeoMarket B2B (Seller Cabinet)
  version: "1.0"
  description: |
    Кабинет продавца. Создание товаров, SKU, управление ценами, накладные.
    Связи с Moderation и B2C — частично восстановлены, детали проектируются.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceKeyAuth:
      type: apiKey
      in: header
      name: X-Service-Key
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: At least one image is required
    CreateProductRequest:
      type: object
      required: [title, description, category_id, images]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 5000
        category_id:
          type: string
          format: uuid
        images:
          type: array
          minItems: 1
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/Image"
        characteristics:
          type: array
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/CharacteristicValue"
    CreateSkuRequest:
      type: object
      required: [product_id, name, price, cost_price, image]
      properties:
        product_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        price:
          type: integer
          minimum: 1
          description: Цена продажи в копейках
        cost_price:
          type: integer
          minimum: 1
          description: Себестоимость в копейках
        discount:
          type: integer
          minimum: 0
          default: 0
          description: Абсолютная скидка в копейках
        image:
          type: string
          minLength: 1
          format: uri-reference
        characteristics:
          type: array
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/CharacteristicValue"
    SkuResponse:
      type: object
      required: [id, product_id, name, price, cost_price, discount, image, active_quantity, reserved_quantity, characteristics]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: integer
        cost_price:
          type: integer
        discount:
          type: integer
        image:
          type: string
        active_quantity:
          type: integer
          default: 0
        reserved_quantity:
          type: integer
          default: 0
        characteristics:
          type: array
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/CharacteristicValue"
    BlockingReason:
      type: object
      required: [id, title, comment]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        comment:
          type: string
    FieldReport:
      type: object
      required: [field_name, comment]
      properties:
        field_name:
          type: string
          enum: [title, description, product_images, category, sku_name, sku_image, sku_price]
        sku_id:
          type: string
          format: uuid
          nullable: true
        comment:
          type: string
    ProductDetail:
      type: object
      required: [id, seller_id, title, description, status, deleted, blocked, category, images, characteristics, skus, blocking_reason, field_reports]
      properties:
        id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [CREATED, ON_MODERATION, MODERATED, BLOCKED, HARD_BLOCKED, DELETED]
        deleted:
          type: boolean
        blocked:
          type: boolean
        category:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        images:
          type: array
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/Image"
        characteristics:
          type: array
          items:
            $ref: "../shared/schemas.yaml#/components/schemas/CharacteristicValue"
        skus:
          type: array
          items:
            $ref: "#/components/schemas/SkuResponse"
        blocking_reason:
          allOf:
            - $ref: "#/components/schemas/BlockingReason"
          nullable: true
        field_reports:
          type: array
          items:
            $ref: "#/components/schemas/FieldReport"

paths:
  /api/v1/products:
    post:
      summary: Создать товар
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Товар создан со статусом CREATED и пустым списком SKU
          content:
            application/json:
              schema:
                $ref: "../shared/schemas.yaml#/components/schemas/Product"
        "400":
          description: Некорректные данные товара или неизвестная категория
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Отсутствует или некорректен JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/products/{id}:
    get:
      summary: Получить товар со всеми SKU и причинами блокировки
      tags: [Products]
      security:
        - bearerAuth: []
        - serviceKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Полная карточка товара в seller-режиме
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "401":
          description: Отсутствует или некорректен JWT или service key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Товар не найден или не принадлежит продавцу
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    put:
      summary: Изменить товар
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Товар обновлён

  /api/v1/skus:
    post:
      summary: Создать SKU
      tags: [SKU]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkuRequest"
      responses:
        "201":
          description: SKU создан; первый SKU переводит товар CREATED в ON_MODERATION и публикует событие CREATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkuResponse"
        "400":
          description: Некорректные данные SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Товар заблокирован или не принадлежит продавцу
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    put:
      summary: Изменить SKU
      tags: [SKU]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: SKU обновлён

  /api/v1/invoices:
    post:
      summary: Создать накладную
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Накладная создана

  /api/v1/invoices/accept:
    post:
      summary: Принять накладную (склад)
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Накладная принята, остатки обновлены

  # ??? — Эндпоинты для B2C (каталог, резервирование) — проектируются
